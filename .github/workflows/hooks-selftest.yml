name: hooks-selftest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hooks-selftest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-test the documentation-sync hook (#156)
        run: python scripts/documentation_sync_hook_selftest.py
