name: Unit Tests

# Host characterization suite (#47, epic #116 Phase B). Compiles the REAL
# dual_track_control.ino inside the stub Arduino environment (tests/stubs) and runs
# every doctest suite. This is the behavior-parity gate for all Phase D
# refactor PRs — required status check for merging.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # read-only job — no push, no token needed
      - name: Create Wi-Fi secrets from template (#125 — the suite compiles the real dual_track_control.ino)
        run: cp sketches/dual_track_control/arduino_secrets.h.example sketches/dual_track_control/arduino_secrets.h
      - name: Build and run host characterization suite
        run: make -C tests run
