name: One-time knowledge graph synchronization
on:
  push:
    branches: [agent/c-builder/wiki-knowledge-map]
    paths: [.github/workflows/knowledge-sync-once.yml]
permissions:
  contents: write
jobs:
  sync:
    if: github.repository == 'boulaajaj/Arduino-DiggerSetup' && github.ref == 'refs/heads/agent/c-builder/wiki-knowledge-map'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge main and regenerate both maps
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit origin/main
          git rm .github/workflows/knowledge-sync-once.yml
          python scripts/check_wiki_selftest.py
          python scripts/build_knowledge_graph_selftest.py
          python scripts/build_knowledge_graph.py
          python scripts/build_knowledge_graph.py --check
          git add docs/knowledge-graph.html docs/knowledge-explorer-kit.html
          git commit -m "Regenerate knowledge maps against current main"
          git push origin HEAD:refs/heads/agent/c-builder/wiki-knowledge-map
