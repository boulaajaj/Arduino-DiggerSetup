<script type="application/json" id="graph-data">{"home":"docs/wiki/home.md","repository":"https://github.com/boulaajaj/Arduino-DiggerSetup","ref":"main","nodes":[{"id":".claude/rules","title":"rules","kind":"directory","summary":""},{"id":".claude/rules/architecture.md","title":"Architecture Rules (canonical spec: docs/architecture/ARCHITECTURE-TARGET.md)","kind":"file","summary":"These rules govern all production-firmware code. The architecture document is canonical; if this file and the doc disagree, the doc wins — fix this file."},{"id":".claude/rules/behavior-preservation.md","title":"Behavior-Preservation Covenant (highest-priority rule)","kind":"file","summary":"Operator's words (2026-07-06): \"organizing, refactoring and improving the code should never ever, ever cause change of controls or change of behavior unless we explicitly discuss it. … We're not messing with the timing, the behavior, the parameters. Nothing should be touched. Everything that was handling inputs and outputs should remain exactly the same. If we upload the firmware again, I would like the machine…"},{"id":".claude/rules/dashboard.md","title":"Dashboard Rules","kind":"file","summary":""},{"id":".claude/rules/firmware-realtime.md","title":"Real-Time Firmware Rules","kind":"file","summary":""},{"id":".claude/rules/naming.md","title":"Naming Rules — self-documenting, full words","kind":"file","summary":"Code must read without a decoder ring. Default: complete English words for every identifier — types, functions, variables, files, folders."},{"id":".claude/rules/state-ownership.md","title":"State Ownership Rules","kind":"file","summary":""},{"id":".claude/rules/workflow.md","title":"Workflow Rules (agent-enforced)","kind":"file","summary":""},{"id":".github/copilot-instructions.md","title":"Copilot Code Review Instructions — Arduino Digger Controller","kind":"file","summary":"This firmware is field-tuned on a real machine with a child rider. Organization and refactor work must change NOTHING observable — no behavior, no timing, no parameter/constant values, no input/output handling. Firmware flashed after a refactor must make the machine perform exactly as before; a behavior change is legitimate only when the PR's linked issue explicitly authorizes it."},{"id":"CLAUDE.md","title":"Excavator Track Controller — Project Memory","kind":"file","summary":"Arduino UNO R4 WiFi-based tank-style track controller for a ride-on excavator. Two FOC brushless motors drive rubber tracks via FOC ESCs. Dual input: RC transmitter (Jason) and joystick (Malaki/rider). 3-position override switch selects who has authority. X.BUS telemetry is streamed to a Wi-Fi dashboard (monitoring only)."},{"id":"OPERATOR-GUIDE.md","title":"Digger Control System — Operator Guide","kind":"file","summary":"This machine has two ways to drive it: an RC remote controller and a joystick. An Arduino UNO R4 WiFi sits in the middle and decides which input controls the tracks based on a 3-position switch on the remote."},{"id":"PROJECT-PLAN.md","title":"Excavator Track Controller — Project Plan","kind":"file","summary":"An Arduino UNO R4 WiFi sits between an RC receiver and two FOC ESCs, implementing a tank-style mixer with a secondary joystick input for the rider. The RC transmitter (Jason) can always override via a 3-position switch."},{"id":"dashboard/index.html","title":"index.html","kind":"file","summary":""},{"id":"docs/AGENT-EXAMPLES.md","title":"Agent Examples — good/bad pairs for embedded work (#53)","kind":"file","summary":"Concrete good/bad task executions for AI agents in this repo. Every pair is either a real event from this project's history or the project's canonical checklist applied. The Working Agreement (CLAUDE.md) states the principles; this file shows what following — and violating — them looks like."},{"id":"docs/ARCHITECTURE.md","title":"Architecture — how the code is shaped, and why","kind":"file","summary":"Written for a human engineer landing on the repo. The machine-checked contracts live elsewhere (spec: ARCHITECTURE-TARGET, inventory: FILE-MAP, authority hierarchy: authority-matrix); this page is the narrative."},{"id":"docs/CONTROL-RESEARCH.md","title":"Tracked Vehicle Control Research","kind":"file","summary":"Reference document for the Arduino DiggerSetup project. Covers RC input architecture, tank mixing best practices, and efficient loop patterns for real-time motor control on the Arduino UNO R4 WiFi (Renesas RA4M1)."},{"id":"docs/DECISION-LOG.md","title":"Decision Log","kind":"file","summary":"Technical decisions, test results, and confirmed hardware facts. Updated by session hooks — only technical content, no personal info."},{"id":"docs/FIRMWARE-UPLOAD-LOG.md","title":"Firmware Upload Log","kind":"file","summary":"Every firmware upload to the digger gets a row here: date, version, commit SHA, branch (+ PR #), board/port, and notes covering what changed and what to test. Log a row on *every* flash, even bench/test builds."},{"id":"docs/GL10-OPERATION.md","title":"GL10 ESC — Operational Procedures","kind":"file","summary":"Source: XC-ESC GL10 official user manual (docs/GL10-Manual.pdf, 3-page image-based PDF from \u003chttps://www.xc-esc.com/product/rc-brushless-sensored-foc-gl10-esc-80a2-4s/>)."},{"id":"docs/GL10-PARAMETERS.md","title":"GL10 ESC — Configurable Parameters Reference","kind":"file","summary":"Source: XC-ESC GL10 official user manual (docs/GL10-Manual.pdf, 3-page PDF from \u003chttps://www.xc-esc.com/product/rc-brushless-sensored-foc-gl10-esc-80a2-4s/>)."},{"id":"docs/GL10-QUICK-REFERENCE.md","title":"GL10 ESC — Quick Reference","kind":"file","summary":"Source: Official GL10 User Manual (docs/GL10-Manual.pdf, downloaded from xc-bldc.com)."},{"id":"docs/HANDOFF-V8-V9-WIFI-LATENCY-AND-OFFLOAD.md","title":"Handoff — V8 Wi-Fi Telemetry Reliability + V9 Architectural Offload","kind":"file","summary":"boulaajaj/Arduino-DiggerSetup — Arduino UNO R4 WiFi controller for a ride-on excavator. Current branch: claude/restore-xbus-telemetry-36. PR #50 open with telemetry + Wi-Fi dashboard work."},{"id":"docs/INTERFACE-BOARD-NETLIST.md","title":"Interface Board — Netlist for Schematic Tools","kind":"file","summary":"Import this into EasyEDA (free, browser-based) or KiCad (free, desktop). Use docs/interface-board.kicad_sch for KiCad direct import."},{"id":"docs/INTERFACE-BOARD-PERFBOARD.md","title":"Interface Board — Perfboard Solder Guide (UNO R4 WiFi)","kind":"file","summary":"Date: 2026-06-13 Issue: #43 Supersedes the stripboard layout in INTERFACE-BOARD.md for the actual build. Schematic + BOM are unchanged from that doc; this adds a breadboard-style perfboard layout and the UNO R4 WiFi correction (X.BUS and S.BUS run simultaneously — both UARTs are free now, no \"plug one at a time\")."},{"id":"docs/INTERFACE-BOARD.md","title":"Interface Board — Build Plan","kind":"file","summary":"Date: 2026-05-23 Purpose: Permanent soldered replacement for the breadboard X.BUS merge and S.BUS inverter circuits. All connections are servo-plug, plug-and-play. Swap an ESC or Arduino without soldering."},{"id":"docs/MISSION.md","title":"Mission — Smoothness Above All","kind":"file","summary":"This document is the constitution of the project. Everything else in the codebase should be consistent with it. If a code change conflicts with any point below, the change is wrong — not the mission."},{"id":"docs/SAFETY.md","title":"Safety Invariants (#131)","kind":"file","summary":"Properties of the propulsion path that must always hold — for any input combination, in any override mode, under any injected fault. Each invariant is executable: it has a host test in tests/invariants/ that drives the real firmware (see docs/TESTING.md) and runs in CI with the #47 characterization suite (the unit-tests check — the layer that binds every contributor). Locally, .githooks/pre-commit hard-blocks red…"},{"id":"docs/TESTING.md","title":"Host Testing — Characterization + Safety Invariants (#47, #131 — Epic #116 Phase B)","kind":"file","summary":"The firmware's control logic runs on a laptop, byte-for-byte unchanged, inside a fake Arduino environment. Two suites share the harness: characterization (#47) locks in example behavior, and invariants (#131) asserts safety properties that must always hold, under injected faults. Together they are the primary safety net for any structural change: every PR must keep them green, proving behavior parity while no…"},{"id":"docs/WIRING-GUIDE-V8.md","title":"Wiring Guide V8.0 — UNO R4 WiFi + GL10 FOC","kind":"file","summary":"Date: 2026-05-24 Board: Arduino UNO R4 WiFi (Renesas RA4M1 + ESP32-S3) Shield: Sensor Shield V5.0 ESCs: 2× GL10 80A Sensored Brushless FOC Motors: 2× GL540L Sensored Brushless (1× CW, 1× CCW)"},{"id":"docs/XBUS-PROTOCOL.md","title":"X.BUS Protocol Reference","kind":"file","summary":"1. Overview 2. Terminology 3. Protocol Structure - 3.1 Hardware / UART Configuration - 3.2 Frame Structure 4. Service Data Control (Point-to-Point) - 4.1 Read Register - 4.2 Write Register 5. Broadcast Data / Control - 5.1 Bulk Write Throttle/Brake + Read Telemetry (0x50) - 5.2 Broadcast State Control (0xA0-0xAF) 6. Register List 7. Hardware Interface (MCU Version) 8. Control Flowchart 9. Desktop Application…"},{"id":"docs/architecture/ARCHITECTURE-TARGET.md","title":"Target Architecture — Dual Track Control","kind":"file","summary":"Status: adopted 2026-07-05 (epic #116, issue #128, ADR-0001) Applies to: the production firmware in sketches/dual_track_control/ (carried its former bring-up name until the #118 rename)"},{"id":"docs/architecture/BENCH-VERIFICATION-DEFERRED.md","title":"Deferred Bench Verification — epic #116 refactor","kind":"file","summary":"No hardware is available during the architecture remediation (constraint locked 2026-07-05), so refactor PRs are verified by compile + host tests + review only. Every PR that would normally get a bench check appends its physical checks here. When the machine is available again, run this entire checklist in one session, then log the flash in docs/FIRMWARE-UPLOAD-LOG.md as usual."},{"id":"docs/architecture/FILE-MAP.md","title":"Repository File Map","kind":"file","summary":"The annotated inventory of load-bearing files and directories — what each one is and which issue shaped it. Moved verbatim from root CLAUDE.md (#197) so the per-session context stays lean; this file is the detailed map's single home. Layer rules live in .claude/rules/architecture.md; the canonical architecture spec is ARCHITECTURE-TARGET.md."},{"id":"docs/architecture/adr/0001-domain-oriented-firmware-architecture.md","title":"ADR-0001: Domain-oriented firmware architecture with enforced boundaries","kind":"file","summary":"Status: Accepted · 2026-07-05 · epic #116, issue #128"},{"id":"docs/wiki/README.md","title":"Project Wiki — AI-maintained knowledge graph","kind":"wiki","summary":"A navigation layer over this repo's documentation, built for graph visualization (Obsidian) and fast orientation. It follows the Karpathy LLM-wiki pattern adopted in #53: agents create and maintain these interconnected notes; humans read and visualize them (issue #141).","body":"# Project Wiki — AI-maintained knowledge graph\n\nA navigation layer over this repo's documentation, built for graph\nvisualization (Obsidian) and fast orientation. It follows the Karpathy\nLLM-wiki pattern adopted in #53: **agents create and maintain these\ninterconnected notes; humans read and visualize them** (issue #141).\n\n## Knowledge structure\n\n- [Home](home.md) is the main index. Domain indexes group related clusters\n  and topics. Topic notes can link across clusters while keeping one parent.\n- Firmware, tests, and canonical docs are the source layer. Notes summarize\n  behavior and link to the evidence. The generated explorer also offers a\n  separate file tree for browsing the entire checkout.\n- For maintenance, follow this guide and the [project rules](../../CLAUDE.md).\n  Read the index before starting a query, update affected notes and links when\n  ingesting evidence, and record substantive changes in the\n  [wiki maintenance log](log.md). Run lint after updating the notes and resolve\n  any semantic discrepancies against the canonical source.\n\nThis adapts [Andrej Karpathy’s LLM Wiki pattern](https://gist.github.com/karpathy/442a6bf555914893e9891c11519de94f)\nto a source-controlled firmware project.\n\n## How to visualize\n\nFrom the repository root, run:\n\n```sh\npython scripts/build_knowledge_graph.py\n```\n\nOpen `docs/knowledge-explorer-kit.html` in a browser. The standalone file includes\nboth views and works offline. GitHub and VS Code links open their respective\ndestinations. Set the local checkout path in the viewer to enable VS Code links.\nThe revision displayed in the viewer identifies the graph inputs, so unrelated\ncommits do not invalidate the HTML.\n\n### Obsidian\n\n1. Open **the repository root** as an Obsidian vault (File → Open folder as\n   vault). The graph then includes both these hub notes and the canonical\n   docs they link to.\n2. `.obsidian/` (your local vault settings) is gitignored — theme and graph\n   tweaks stay on your machine.\n3. Notes use standard relative Markdown links, so everything here also reads\n   normally on GitHub. Obsidian graphs Markdown links natively.\n\n## Rules for this folder (anti-drift)\n\n- **Navigation layer, not a second copy.** Notes describe stable concepts and\n  link to the canonical source — which artifact is canonical for what is\n  stated once in [authority-matrix](authority-matrix.md). Tunable values —\n  constants, thresholds, pin numbers, versions — live ONLY in their\n  authority (the config layer for tunables); a wiki note that restates one\n  is a bug. Stable\n  identity is fine: component model names and ordinary descriptive\n  quantities (\"three-position switch\") make notes readable and only change\n  when the thing itself changes.\n- **One parent per topic.** Every Markdown note except `home.md` declares a\n  relative `parent` path in frontmatter. The parent must link to the note using\n  a standard Markdown link. All parent chains reach Home. Additional links\n  connect related topics across the hierarchy. Mark dated context with\n  `status: historical`; `status: current` is optional.\n- **Agents own this folder.** A PR that adds, removes, or renames a doc — or\n  changes what a subsystem IS — updates the affected wiki notes in the same\n  PR. Link fixes are cheap; that is the point of keeping content out.\n- **Every note declares its sources** (#202): a `---` frontmatter block with\n  a `sources:` list of the repo paths the note navigates to (`sources: none`\n  for pure-navigation pages). Declared paths must exist — a vanished source\n  fails the lint, which is the point: the note must be reconsidered.\n- **CI enforces this** (`wiki-lint` workflow, `scripts/check_wiki.py`,\n  #145/#202): broken links and anchors, orphan notes, notes unreachable\n  from [home](home.md), tunable-looking values, missing or invalid sources\n  frontmatter, duplicate titles, and deprecated phrases all fail the build.\n  The same job checks parent chains and whether the HTML matches its inputs.\n  Stage new files before building so the generator includes them. Keep new\n  hierarchy links in the existing relative Markdown syntax.\n- Start at [home](home.md).","status":"unspecified","parent":"docs/wiki/agent-governance.md","depth":2,"domain":"docs/wiki/agent-governance.md"},{"id":"docs/wiki/agent-governance.md","title":"Agent governance","kind":"wiki","summary":"How AI agents (Claude Code, Copilot, CodeRabbit) are steered in this repo — the Karpathy method (#53) plus the behavior-preservation covenant (permanent policy — born in epic #116, retained after its 2026-07-20 close).","body":"# Agent governance\n\nHow AI agents (Claude Code, Copilot, CodeRabbit) are steered in this repo —\nthe Karpathy method (#53) plus the behavior-preservation covenant\n(permanent policy — born in epic #116, retained after its 2026-07-20 close).\n\n- **Working Agreement** — four principles (think before coding, simplicity\n  first, surgical changes, goal-driven execution with a verifiable gate):\n  [CLAUDE.md](../../CLAUDE.md)\n- **The covenant** — organization changes NOTHING observable; behavior fixes\n  need their own issue BEFORE the fix, never ride another PR:\n  [.claude/rules/behavior-preservation](../../.claude/rules/behavior-preservation.md)\n- **Worked examples** — real good/bad task-execution pairs:\n  [AGENT-EXAMPLES](../AGENT-EXAMPLES.md)\n- **Path-scoped rules** —\n  [architecture](../../.claude/rules/architecture.md) ·\n  [naming](../../.claude/rules/naming.md) ·\n  [state-ownership](../../.claude/rules/state-ownership.md) ·\n  [firmware-realtime](../../.claude/rules/firmware-realtime.md) ·\n  [dashboard](../../.claude/rules/dashboard.md) ·\n  [workflow](../../.claude/rules/workflow.md)\n- **Project skills** (#127) — repeatable procedures the agent runs on\n  demand, one folder per skill under `.claude/skills/`: safety-review,\n  flash-and-log, new-module, field-tune, wiki-impact-review,\n  prepare-pull-request. Each skill owns its procedure; canonical docs and\n  this wiki only point to it.\n- **Reviewer subagents** (#127) — read-only specialist reviewers under\n  `.claude/agents/` (architecture, safety, tests, documentation) that\n  challenge a diff before it is marked ready — they report, never edit.\n- **Review bots** — `.coderabbit.yaml` (permanent covenant steering) and\n  [copilot-instructions](../../.github/copilot-instructions.md) mirror the\n  same rules so bot reviews align with the program\n- **This wiki** is itself governed here: agents maintain it, PRs that change\n  docs update affected notes ([README](README.md)); a session hook\n  (`scripts/documentation_sync_hook.py`, #156) prompts the agent to re-check\n  wiki + architecture docs whenever production code changes, and CI\n  enforces the deterministic half (#199): the change-impact manifest\n  (`docs/architecture/change-impact.json`) maps source areas to knowledge\n  pages, and a PR touching a mapped area must update an affected page or\n  carry a documentation receipt. The judgment half (#200) is the\n  semantic-doc-lint skill — a monthly deep pass over every note's declared\n  sources (a scheduled workflow opens the reminder issue), with per-PR\n  coverage from the documentation-reviewer agent in the pre-request\n  self-review.\n\nThe [testing](testing.md) suites are the enforcement arm: expectations are\nlaw, and the gate defines \"done\" for any agent task.","status":"unspecified","parent":"docs/wiki/home.md","depth":1,"domain":"docs/wiki/agent-governance.md"},{"id":"docs/wiki/alerts-and-alarms.md","title":"Alerts and alarms","kind":"wiki","summary":"The piezo combines the manual horn, one-shot patterns, and the selected repeating alarm. Signals include Wi-Fi readiness, thermal warning, cutoff and recovery, RC inactivity, and a low-battery alarm fed by the battery ladder. See notification channels for priority, ESC beeps, and the dashboard’s independent warning display.","body":"# Alerts and alarms\n\nThe piezo combines the manual horn, one-shot patterns, and the selected\nrepeating alarm. Signals include Wi-Fi readiness, thermal warning, cutoff\nand recovery, RC inactivity, and a low-battery alarm fed by the\n[battery ladder](battery-ladder.md). See [notification channels](notification-channels.md)\nfor priority, ESC beeps, and the dashboard’s independent warning display.\n\n- Current pin, patterns, thresholds, and debounce:\n  [CLAUDE.md](../../CLAUDE.md) (canonical); the beep table for operators:\n  [OPERATOR-GUIDE](../../OPERATOR-GUIDE.md)\n- **Sound-only by design**: alarms never slow or stop the motors — motion\n  authority belongs exclusively to the [safety system](safety-system.md)\n  ladders and the [output gate](output-gate.md). A low-battery motor cutoff\n  exists separately in the [battery ladder](battery-ladder.md); the alarm is\n  the operator-warning layer above it.\n- History (a reverse beeper was removed, alerts returned as alarms):\n  [DECISION-LOG](../DECISION-LOG.md)","status":"unspecified","parent":"docs/wiki/safety-system.md","depth":2,"domain":"docs/wiki/safety-system.md"},{"id":"docs/wiki/application-loop.md","title":"Application loop — one control cycle","kind":"wiki","summary":"What firmwareLoop() does each pass, in order. The order IS the safety design; source of truth: FirmwareApp.cpp.","body":"# Application loop — one control cycle\n\nWhat `firmwareLoop()` does each pass, in order. The order IS the safety\ndesign; source of truth:\n[FirmwareApp.cpp](../../sketches/dual_track_control/src/application/FirmwareApp.cpp).\n\n1. **Read inputs** — S.BUS frame (one frame carries all channels, one\n   freshness timeout covers them all), horn button, then the protection\n   ladders: battery Eco-lock, battery cutoff, thermal stages. Ladders run\n   BEFORE gear selection so a lock can force Eco.\n2. **Gear + joystick** — gear select honors the Eco locks; the joystick is\n   sampled on its own cadence and shaped (deadband, expo, gain).\n3. **Mix** — RC and joystick combine at the axis level, then curvatureDrive\n   runs once on the combined command (average-speed gear cap, pivot blend,\n   desaturation). Invalid RC mixes to neutral.\n4. **Safety decision + output gate** — the safety supervisor\n   ([safety-system](safety-system.md)) decides drive-allowed from RC\n   freshness, battery confirmation/boot grace, cutoff latch, and thermal\n   cut; the output gate executes it (ACTIVE → ease-to-neutral HOLD → CUT\n   detach, re-attach on recovery).\n5. **Watchdog refresh — the ONLY refresh point, after the control path.**\n   Anything below that stalls the loop misses the refresh, the MCU resets,\n   PWM stops, and the ESCs failsafe — the runaway backstop.\n6. **Observers** — X.BUS telemetry poll (read-only Read Register; it runs\n   AFTER the gate and cannot affect the control output), Wi-Fi dashboard\n   serving plus its periodic serving diagnostics (monitoring only), then\n   the alert/beeper state machines\n   ([telemetry-and-dashboard](telemetry-and-dashboard.md)).\n7. **Debug output** — the CSV line, last.\n\nSetup mirrors the same philosophy: adapters initialize first, the watchdog\narms LAST (after the slow Wi-Fi bring-up) so initialization cannot trip it.\n\nTwo ordering invariants worth naming: the ladders precede gear selection,\nand nothing observable comes between the output gate and the watchdog\nrefresh. Both are locked by the host suites ([testing](testing.md)).","status":"unspecified","parent":"docs/wiki/architecture-overview.md","depth":2,"domain":"docs/wiki/architecture-overview.md"},{"id":"docs/wiki/architecture-overview.md","title":"Architecture overview","kind":"wiki","summary":"The durable map of the firmware as it IS — independent of the migration program that produced it (architecture-remediation is the dated history of how we got here).","body":"# Architecture overview\n\nThe durable map of the firmware as it IS — independent of the migration\nprogram that produced it ([architecture-remediation](architecture-remediation.md)\nis the dated history of how we got here).\n\n## Shape\n\nThe production sketch's `.ino` is a **composition root only**: it includes\nthe application layer and delegates `setup()`/`loop()`. Everything else\nlives under `src/` in layers with a one-way dependency direction:\n\n- **`domain/`** — pure logic (battery, thermal, operator_input, drive,\n  safety). Host-testable by construction: no hardware includes, time and\n  state passed as parameters.\n- **`application/`** — orchestration and the firmware's mutable state; the\n  former module sections live here. What one pass does:\n  [application-loop](application-loop.md).\n- **`ports/`** — hardware contracts as link-time seams;\n  **`infrastructure/`** — the ONLY layer with hardware includes,\n  implementing them: [ports-and-adapters](ports-and-adapters.md).\n- **`telemetry/` + `alerts/`** — read-only observers of the\n  SystemSnapshot, and the alert policy/pattern logic.\n- **`config/`** — every tunable, per domain. Who owns which value:\n  [configuration-authority](configuration-authority.md).\n\n## Where the contracts live\n\n- Canonical spec + dependency table:\n  [ARCHITECTURE-TARGET](../architecture/ARCHITECTURE-TARGET.md) and\n  [ADR-0001](../architecture/adr/0001-domain-oriented-firmware-architecture.md)\n- Annotated file inventory: [FILE-MAP](../architecture/FILE-MAP.md)\n- Mechanical enforcement: the architecture-fitness CI workflow\n  (layer/size/naming rules) — see [testing](testing.md) for the gate list\n- Human-facing narrative of all of the above:\n  [ARCHITECTURE](../ARCHITECTURE.md) (#126)\n- Which artifact wins for what: [authority-matrix](authority-matrix.md)","status":"unspecified","parent":"docs/wiki/home.md","depth":1,"domain":"docs/wiki/architecture-overview.md"},{"id":"docs/wiki/architecture-remediation.md","title":"Architecture remediation (epic #116)","kind":"wiki","summary":"Active program: reorganize the single-sketch firmware into a domain-oriented structure — without changing one observable behavior (governance). Firmware flashed after any refactor must drive exactly as before.","body":"# Architecture remediation (epic #116)\n\nActive program: reorganize the single-sketch firmware into a domain-oriented\nstructure — **without changing one observable behavior**\n([governance](agent-governance.md)). Firmware flashed after any refactor must\ndrive exactly as before.\n\n- **Target architecture** —\n  [ARCHITECTURE-TARGET](../architecture/ARCHITECTURE-TARGET.md): layers\n  (`application` / `domain` / `ports` / `infrastructure`), dependency rules,\n  migration order; annotated file inventory in\n  [FILE-MAP](../architecture/FILE-MAP.md) (#197)\n- **Founding ADR** —\n  [0001-domain-oriented-firmware-architecture](../architecture/adr/0001-domain-oriented-firmware-architecture.md)\n- **Phases** — A Define → B Protect ([testing](testing.md) suites, done) →\n  C Govern (CI fitness functions, done) → D Refactor (extract domains,\n  **complete** — the sketch is a composition root and the check_ino\n  fitness rule is active) → E Polish (next)\n- **Extracted domains so far** — the [battery ladder](battery-ladder.md)'s\n  voltage-plausibility gate and its two staged state machines (Eco lock,\n  cutoff + boot gate) live in `src/domain/battery/`; the\n  [thermal derating](thermal-derating.md) hysteresis stage, hottest-sensor\n  selection, and warn/eco/cut staging live in `src/domain/thermal/`; the\n  [X.BUS telemetry](xbus-telemetry.md) register-decode and ×10 wire-encode\n  scaling lives in `src/telemetry/` (observer layer); the operator-input\n  expo curve and center-snap deadband live in `src/domain/operator_input/`;\n  the curvature tank mix — the propulsion-path core — plus the gear policy\n  and the RC/joystick command mixer live in `src/domain/drive/`; the drive\n  allow/deny supervisor (SafetyDecision + FailsafeReason) and the\n  ACTIVE/HOLD/CUT [output gate](output-gate.md) state machine live in\n  `src/domain/safety/`. All pure logic — no Arduino includes, time passed\n  as a parameter, hardware effects returned as actions for the sketch to\n  execute; the sketch keeps thin delegates until the composition root lands\n- **Ports + adapters** — `src/ports/` link-time seams (ESC output,\n  joystick ADC, piezo alert, RC input, ESC telemetry, dashboard service,\n  clock, watchdog, debug console)\n  with their `src/infrastructure/` adapters (`arduino/` + `radiolink/` +\n  `xc/` + `network/`) owning the Servo objects, the ADC settle sequence,\n  the piezo pin, the S.BUS UART + parser, the\n  [X.BUS telemetry](xbus-telemetry.md) poller, and the\n  [Wi-Fi dashboard](wifi-dashboard.md) serving machine: infrastructure is\n  the only layer that includes hardware libraries, vendor types (the bfs\n  S.BUS frame) are translated to domain types (`RcFrame`) at the port\n  boundary, the telemetry port owns the `EscTelem` type it delivers while\n  the sketch keeps owning the array, and the network layer only ever\n  handles encoded bytes (the reverse `TelemetryFrameSource` seam)\n- **Config is a layer** — every tunable lives in `src/config/` per-domain\n  headers (BuildInfo carries the version single source of truth, Pins\n  carries the application pin map); the `[CONFIG]` section of the sketch\n  is now their include point, and values are law\n- **Alerts are a layer** — the beep vocabulary lives in `src/alerts/`:\n  `AlertPolicy` (the priority ladder, the low-voltage latch with its own\n  plausibility form, inactivity tracking) + `PatternPlayer` (one-shot and\n  repeating sequencing), all time-as-a-parameter; the piezo stays behind\n  the alert output port and the final horn/pattern/alarm OR stays with the\n  sketch shim ([safety system](safety-system.md))\n- **Observers read a snapshot** — `src/application/SystemSnapshot.h` is the\n  immutable per-cycle observation; the dashboard JSON and debug CSV\n  encoders (`src/telemetry/`) consume it `const&` and can no longer reach\n  into module internals ([telemetry and\n  dashboard](telemetry-and-dashboard.md))\n- **Protection first** — the [characterization and invariant\n  suites](testing.md) were built BEFORE any code moves, so every refactor\n  step is verified against locked behavior\n- **Physical checks we cannot run** (no hardware during the program) are\n  queued in\n  [BENCH-VERIFICATION-DEFERRED](../architecture/BENCH-VERIFICATION-DEFERRED.md)\n- Decisions land in the [DECISION-LOG](../DECISION-LOG.md) as they are made\n\nWork is tracked on the GitHub project board — one issue per PR, one PR open\nat a time ([.claude/rules/workflow](../../.claude/rules/workflow.md)).","status":"historical","parent":"docs/wiki/architecture-overview.md","depth":2,"domain":"docs/wiki/architecture-overview.md"},{"id":"docs/wiki/authority-matrix.md","title":"Authority matrix — which artifact wins for what","kind":"wiki","summary":"\"Canonical\" gets used loosely across this repo. This page states the hierarchy once; every other document points here instead of restating it. When two sources disagree about a row's question, the artifact named in that row wins — and the disagreement itself is a doc bug to file.","body":"# Authority matrix — which artifact wins for what\n\n\"Canonical\" gets used loosely across this repo. This page states the\nhierarchy once; every other document points here instead of restating it.\nWhen two sources disagree about a row's question, the artifact named in\nthat row wins — and the disagreement itself is a doc bug to file.\n\n| Question | The authority | Where |\n| --- | --- | --- |\n| What does the firmware DO? | The code, proven by the host suites — test expectations are behavior law | [dual_track_control](../../sketches/dual_track_control/dual_track_control.ino) + [testing](testing.md) |\n| What are the current tunable values? | The config layer — no doc carries a live copy | `sketches/dual_track_control/src/config/` (inventory: [FILE-MAP](../architecture/FILE-MAP.md)) |\n| What structure must code follow? | The architecture spec + accepted ADRs (rules files summarize; the spec wins) | [ARCHITECTURE-TARGET](../architecture/ARCHITECTURE-TARGET.md) + [ADR-0001](../architecture/adr/0001-domain-oriented-firmware-architecture.md) |\n| What must NEVER change without sign-off? | The safety-invariant registry, each invariant tied to an executable test | [SAFETY](../SAFETY.md) + [safety-system](safety-system.md) |\n| How is the machine operated? | The operator guide (numbers there must match the config layer — drift is a doc bug) | [OPERATOR-GUIDE](../../OPERATOR-GUIDE.md) |\n| Why is it this way? | The dated decision log — history is immutable, entries are never retro-edited | [DECISION-LOG](../DECISION-LOG.md) |\n| Where do I start reading? | This wiki — navigation and synthesis only, never a second copy | [home](home.md) |\n| How do agents work here? | Project memory + path-scoped rules + skills, in that order of generality | [CLAUDE.md](../../CLAUDE.md) + [agent-governance](agent-governance.md) |\n\nTwo standing corollaries:\n\n- **A changed test expectation is a behavior change**, not a refactor — it\n  needs its own issue and operator sign-off before any code is written\n  ([agent-governance](agent-governance.md)).\n- **Docs describe behavior, never live numbers.** Anything quoting a\n  tunable outside the config layer is either a dated historical record\n  (allowed) or drift (a bug).","status":"unspecified","parent":"docs/wiki/architecture-overview.md","depth":2,"domain":"docs/wiki/architecture-overview.md"},{"id":"docs/wiki/battery-ladder.md","title":"Battery ladder","kind":"wiki","summary":"Staged response to falling pack voltage, always keyed to the worse of the two packs: first a forced-Eco lock (machine keeps driving, slower), then an audible low-voltage alarm (alerts and alarms), and at the bottom a latched cutoff — the output gate closes and stays closed until power-cycle, even if voltage recovers. The alarm keeps chirping through the cut, so a cutoff is never silent.","body":"# Battery ladder\n\nStaged response to falling pack voltage, always keyed to the **worse** of the\ntwo packs: first a forced-Eco lock (machine keeps driving, slower), then an\naudible low-voltage alarm ([alerts and alarms](alerts-and-alarms.md)), and at\nthe bottom a **latched cutoff** — the [output gate](output-gate.md) closes\nand stays closed until power-cycle, even if voltage recovers. The alarm keeps\nchirping through the cut, so a cutoff is never silent.\n\n- Current thresholds, debounce times, and the boot-gate behavior:\n  [CLAUDE.md](../../CLAUDE.md) and [SAFETY](../SAFETY.md) (canonical)\n- Invariants and fault-injection tests (cutoff dominates every drive request;\n  boot with a low pack never emits one non-neutral pulse):\n  [SAFETY](../SAFETY.md) · [testing](testing.md)\n- Voltage arrives via [X.BUS telemetry](xbus-telemetry.md); implausible\n  readings are rejected by plausibility gates, and telemetry dropout\n  deliberately freezes the ladder ([SAFETY](../SAFETY.md) \"Known gaps\"\n  documents the edge cases). The worst-of-two plausibility gate and the\n  two-stage ladder state machines are the first extracted domain of the\n  [architecture remediation](architecture-remediation.md)\n  (`src/domain/battery/`); the sketch keeps thin delegates\n- Operator-facing behavior and what the beeps mean:\n  [OPERATOR-GUIDE](../../OPERATOR-GUIDE.md)\n\nDeliberate asymmetry: battery cutoff **latches** until power-cycle, while\n[thermal cut](thermal-derating.md) auto-recovers — both are intended and\ntest-locked.","status":"unspecified","parent":"docs/wiki/safety-system.md","depth":2,"domain":"docs/wiki/safety-system.md"},{"id":"docs/wiki/configuration-authority.md","title":"Configuration authority — which values live where","kind":"wiki","summary":"Every number has exactly one home. The full hierarchy of who wins what: authority-matrix; this page maps the value KINDS.","body":"# Configuration authority — which values live where\n\nEvery number has exactly one home. The full hierarchy of who wins what:\n[authority-matrix](authority-matrix.md); this page maps the value KINDS.\n\n- **Domain and application tunables** — per-domain headers in the\n  production sketch's `src/config/` (input shaping, drive caps, battery and\n  thermal thresholds, alert timings, safety windows, Wi-Fi serving\n  identity, the shared pin map, and the firmware version single source of\n  truth). Values are law: docs describe behavior and never carry a live\n  copy.\n- **Secrets** — Wi-Fi credentials live in a gitignored `arduino_secrets.h`\n  (template committed, real file never); they are not configuration and\n  never appear in any doc.\n- **Adapter-owned tunables** — deliberately NOT in `src/config/`: a value\n  that only tunes one adapter's machinery stays single-homed with that\n  adapter (the X.BUS poll cadence constants live with the X.BUS poller, the\n  Wi-Fi serving knobs with the network stack, the S.BUS UART pins with the\n  S.BUS adapter). Moving them out would create a second home without a\n  second reader.\n- **Dashboard branding** — display name, slogan, badge, accent colors are a\n  SKIN, not platform config; they belong in one configuration block in the\n  dashboard source (white-label rule; tracked as its own issue).\n- **Operator-facing numbers** — the operator guide and project plan may\n  quote values for humans, but they must MATCH `src/config/`; drift is a\n  doc bug on the doc's side.\n- **Historical numbers** — dated records (decision log, upload log) keep\n  the values that were true at the time, forever; history is never\n  retro-edited.\n\nChanging any tunable is a behavior change: own issue, operator sign-off,\nexpectations updated in the same PR ([agent-governance](agent-governance.md),\n[testing](testing.md)).","status":"unspecified","parent":"docs/wiki/architecture-overview.md","depth":2,"domain":"docs/wiki/architecture-overview.md"},{"id":"docs/wiki/control-pipeline.md","title":"Control pipeline","kind":"wiki","summary":"Stick to track, end to end — all shaping happens on the Arduino, all motor smoothing inside the ESC's FOC. Canonical description with current values: CLAUDE.md \"Architecture Summary\"; research background: CONTROL-RESEARCH.","body":"# Control pipeline\n\nStick to track, end to end — all shaping happens on the Arduino, all motor\nsmoothing inside the ESC's FOC. Canonical description with current values:\n[CLAUDE.md](../../CLAUDE.md) \"Architecture Summary\"; research background:\n[CONTROL-RESEARCH](../CONTROL-RESEARCH.md).\n\n1. Inputs: [S.BUS input](sbus-input.md) (RC) and the joystick ADC\n2. Shaping: deadband + expo curves per axis\n3. Mixing: [curvature drive](curvature-drive.md) (tank mix with pivot blend)\n4. Authority: [override modes](override-modes.md) select RC / joystick / blend\n5. Limits: [gear and reverse caps](gear-and-reverse-caps.md), then the\n   [safety system](safety-system.md) may derate or close the\n   [output gate](output-gate.md)\n6. Output: servo PWM per track to the GL10 ESCs ([hardware](hardware.md))\n\nTwo permanent design decisions guard this pipeline: it is **open-loop** (no\nRPM feedback — the FOC ESC owns execution) and **nothing on the Wi-Fi side\ncan command a motor** ([telemetry and dashboard](telemetry-and-dashboard.md)\nis monitoring-only). Why smoothness dominates every trade-off:\n[MISSION](../MISSION.md).","status":"unspecified","parent":"docs/wiki/home.md","depth":1,"domain":"docs/wiki/control-pipeline.md"},{"id":"docs/wiki/curvature-drive.md","title":"Curvature drive","kind":"wiki","summary":"The tank-mixing algorithm: throttle plus steering in, one speed per track out. At speed it behaves like a car (inner track slows, outer speeds up by the same delta — average speed stays what the stick asked); near standstill it blends smoothly into pivot mode, counter-rotating the tracks in place. Feeding throttle mid-pivot arcs the machine out of the pivot instead of surging it forward.","body":"# Curvature drive\n\nThe tank-mixing algorithm: throttle plus steering in, one speed per track\nout. At speed it behaves like a car (inner track slows, outer speeds up by\nthe same delta — average speed stays what the stick asked); near standstill\nit blends smoothly into **pivot mode**, counter-rotating the tracks in place.\nFeeding throttle mid-pivot arcs the machine out of the pivot instead of\nsurging it forward.\n\n- Current constants, blend thresholds, and taper values:\n  [CLAUDE.md](../../CLAUDE.md) \"Architecture Summary\" (canonical)\n- Why this mix was chosen and the research behind it:\n  [CONTROL-RESEARCH](../CONTROL-RESEARCH.md)\n- Field-tuning history (blend band, pivot throttle taper, reverse-steer\n  consistency): [DECISION-LOG](../DECISION-LOG.md)\n- Its outputs are bounded by [gear and reverse caps](gear-and-reverse-caps.md)\n  and gated by the [safety system](safety-system.md)\n- Position in the chain: [control pipeline](control-pipeline.md)\n\nThe average-speed property matters for safety review: caps bound the AVERAGE\ntrack command, and single-track excursions in turns are design headroom, not\nviolations ([SAFETY](../SAFETY.md)).","status":"unspecified","parent":"docs/wiki/control-pipeline.md","depth":2,"domain":"docs/wiki/control-pipeline.md"},{"id":"docs/wiki/dashboard-display.md","title":"Dashboard display and status","kind":"wiki","summary":"The two track panels show per-ESC speed, temperatures, estimated power, and pack voltage and charge. The center view estimates vehicle speed and shows direction from PWM commands. The lower row shows throttle commands, current, power and elapsed viewing time. Gear and authority badges reflect the firmware snapshot.","body":"# Dashboard display and status\n\nThe two track panels show per-ESC speed, temperatures, estimated power,\nand pack voltage and charge. The center view estimates vehicle speed and\nshows direction from PWM commands. The lower row shows throttle commands,\ncurrent, power and elapsed viewing time. Gear and authority badges reflect\nthe firmware snapshot.\n\nThe browser keeps stale per-ESC readings visible at reduced opacity. It\neases gauges toward incoming values, shows a prioritized safety banner, and\nreports quiet or failed connections through a separate status indicator.\nThe page can reconnect on its own or through the reconnect button.\n\n- [Telemetry interfaces](telemetry-interfaces.md) explains the wire fields.\n- [Notification channels](notification-channels.md) explains how visual\n  warnings relate to piezo and ESC sounds.\n- [Dashboard rules](../../.claude/rules/dashboard.md) cover frame budget and\n  replay checks.","status":"unspecified","parent":"docs/wiki/wifi-dashboard.md","depth":3,"domain":"docs/wiki/telemetry-and-dashboard.md"},{"id":"docs/wiki/drive-safeguards.md","title":"Drive safeguards","kind":"wiki","summary":"Read this topic when tracing a refused drive command. The receiver's failsafe flag and the local stale-frame timer determine whether RC is valid. Invalid RC blocks propulsion in every authority mode. The receiver's lost frame flag is reported separately for diagnostics.","body":"# Drive safeguards\n\nRead this topic when tracing a refused drive command. The receiver's\nfailsafe flag and the local stale-frame timer determine whether RC is valid.\nInvalid RC blocks propulsion in every authority mode. The receiver's lost\nframe flag is reported separately for diagnostics.\n\nThe [output gate](output-gate.md) applies the supervisor decision after\ninput shaping and gear selection. The watchdog is serviced after the\ncontrol path and before telemetry, Wi-Fi, and alerts. Its job is to reset\nthe controller if a loop stalls while the ESCs are still receiving PWM.\n\n- [Safety invariants](../SAFETY.md#the-invariants) links each guarantee to\n  an executable test, including bounds, dropout, cutoff, and gear limits.\n- [Known gaps](../SAFETY.md#known-gaps-documented-not-silently-fixed) describes the pack plausibility case\n  and the transient associated with cached joystick input during upshift.\n- [Bench verification](../architecture/BENCH-VERIFICATION-DEFERRED.md)\n  tracks what the host suite cannot prove about the physical machine.\n- Related topics: [S.BUS input](sbus-input.md),\n  [gear and reverse caps](gear-and-reverse-caps.md), [testing](testing.md).","status":"unspecified","parent":"docs/wiki/output-gate.md","depth":3,"domain":"docs/wiki/safety-system.md"},{"id":"docs/wiki/gear-and-reverse-caps.md","title":"Gear and reverse caps","kind":"wiki","summary":"The speed-limiting layer between curvature drive and the output gate. A three-position RC switch selects a gear (Eco / Normal / Boost); each gear caps the average track speed, leaving the outer track headroom to hold speed through corners. Reverse gets its own, lower cap per gear. In Eco, the pivot cap is boosted so the rider keeps usable maneuvering authority.","body":"# Gear and reverse caps\n\nThe speed-limiting layer between [curvature drive](curvature-drive.md) and\nthe [output gate](output-gate.md). A three-position RC switch selects a gear\n(Eco / Normal / Boost); each gear caps the **average** track speed, leaving\nthe outer track headroom to hold speed through corners. Reverse gets its own,\nlower cap per gear. In Eco, the pivot cap is boosted so the rider keeps\nusable maneuvering authority.\n\n- Current cap values, the pivot boost, and the joystick gain:\n  [CLAUDE.md](../../CLAUDE.md) (canonical)\n- The invariant and its test — no input combination exceeds the active caps\n  on the average track command: [SAFETY](../SAFETY.md)\n- Why reverse caps are true percentages (ESC recalibration history) and how\n  the gear spread was tuned: [DECISION-LOG](../DECISION-LOG.md)\n- The [battery ladder](battery-ladder.md) and\n  [thermal derating](thermal-derating.md) can force the Eco cap regardless of\n  the switch position\n\n**Average, not per-track**: a single track legitimately exceeds the gear cap\nmid-turn — that headroom is the design, not a bug. Reviewers and agents keep\ntripping on this; it is locked by test.","status":"unspecified","parent":"docs/wiki/control-pipeline.md","depth":2,"domain":"docs/wiki/control-pipeline.md"},{"id":"docs/wiki/hardware.md","title":"Hardware","kind":"wiki","summary":"Arduino UNO R4 WiFi (RA4M1 + ESP32-S3 Wi-Fi coprocessor) drives two XC GL10 FOC ESCs paired with GL540L sensored brushless motors, powered by two 3S LiPo packs. Inputs: Radiolink RC system over S.BUS and a hall-effect dual-axis joystick on the ADC. Canonical component table and pin assignments: CLAUDE.md.","body":"# Hardware\n\nArduino **UNO R4 WiFi** (RA4M1 + ESP32-S3 Wi-Fi coprocessor) drives two\nXC GL10 FOC ESCs paired with GL540L sensored brushless motors, powered by two\n3S LiPo packs. Inputs: Radiolink RC system over [S.BUS](sbus-input.md) and a\nhall-effect dual-axis joystick on the ADC. Canonical component table and pin\nassignments: [CLAUDE.md](../../CLAUDE.md).\n\n- [Wiring and Arduino ports](wiring-and-ports.md) — follow each component to\n  its signal path, pin or UART, and supporting evidence.\n- [WIRING-GUIDE-V8](../WIRING-GUIDE-V8.md) — canonical wiring reference\n- [INTERFACE-BOARD-PERFBOARD](../INTERFACE-BOARD-PERFBOARD.md) — soldered\n  interface board (X.BUS merge + S.BUS inverter); design history in\n  [INTERFACE-BOARD](../INTERFACE-BOARD.md) and netlist in\n  [INTERFACE-BOARD-NETLIST](../INTERFACE-BOARD-NETLIST.md)\n- [GL10-PARAMETERS](../GL10-PARAMETERS.md) — every ESC parameter analyzed\n  against what the firmware actually commands (read before ANY ESC change)\n- [GL10-OPERATION](../GL10-OPERATION.md) — calibration, factory reset, LED\n  and beep codes; quick card: [GL10-QUICK-REFERENCE](../GL10-QUICK-REFERENCE.md)\n\nThe GL10's internal FOC owns motor smoothing — the Arduino sends open-loop\nservo PWM commands only (see [control pipeline](control-pipeline.md)). The\nhardware history (older sensored ESCs, the board migration) is recorded in\n[CLAUDE.md](../../CLAUDE.md) and the [DECISION-LOG](../DECISION-LOG.md).","status":"unspecified","parent":"docs/wiki/home.md","depth":1,"domain":"docs/wiki/hardware.md"},{"id":"docs/wiki/home.md","title":"Home — Excavator Track Controller","kind":"wiki","summary":"Tank-style dual-track controller for a ride-on excavator: Arduino UNO R4 WiFi, two FOC ESCs, dual input (RC transmitter + rider joystick), Wi-Fi telemetry dashboard. Project memory: CLAUDE.md · full spec: PROJECT-PLAN.md · design philosophy: MISSION (smoothness above all).","body":"# Home — Excavator Track Controller\n\nTank-style dual-track controller for a ride-on excavator: Arduino UNO R4\nWiFi, two FOC ESCs, dual input (RC transmitter + rider joystick), Wi-Fi\ntelemetry dashboard. Project memory: [CLAUDE.md](../../CLAUDE.md) · full\nspec: [PROJECT-PLAN.md](../../PROJECT-PLAN.md) · design philosophy:\n[MISSION](../MISSION.md) (smoothness above all).\n\nWhich artifact wins for what: [authority-matrix](authority-matrix.md).\n\nThis is the main index. Start with the domain indexes below, then follow their\nlinks to focused topics and source files.\n\n## Domain indexes\n\n- [Hardware](hardware.md) — board, ESCs, motors, batteries, wiring\n- [Control pipeline](control-pipeline.md) — stick to track PWM, end to end\n- [Safety system](safety-system.md) — invariants, ladders, gates, failsafes\n- [Telemetry and dashboard](telemetry-and-dashboard.md) — X.BUS in, Wi-Fi out\n- [Testing](testing.md) — host suites that compile the real firmware\n- [Agent governance](agent-governance.md) — Karpathy method, covenant, bots\n- [Architecture](architecture-overview.md) — layers, seams, and the loop\n  ([application-loop](application-loop.md) ·\n  [ports-and-adapters](ports-and-adapters.md) ·\n  [configuration-authority](configuration-authority.md))\n\n## People and operations\n\n- [Wiki guide](README.md) — structure, refresh rules, and the [maintenance log](log.md)\n- [OPERATOR-GUIDE](../../OPERATOR-GUIDE.md) — for the RC supervisor and rider\n- [FIRMWARE-UPLOAD-LOG](../FIRMWARE-UPLOAD-LOG.md) — the device's flight log\n- [DECISION-LOG](../DECISION-LOG.md) — every technical decision, dated","status":"unspecified","depth":0},{"id":"docs/wiki/log.md","title":"Wiki maintenance log","kind":"wiki","summary":"Append a dated entry when ingesting new evidence, filing a durable answer, or correcting a finding from a lint review. Link the affected notes and leave previous entries intact.","body":"# Wiki maintenance log\n\nAppend a dated entry when ingesting new evidence, filing a durable answer,\nor correcting a finding from a lint review. Link the affected notes and leave\nprevious entries intact.\n\n## 2026-11-23 · Ingest · controller knowledge map\n\nExpanded the repository map and reviewed the firmware, dashboard, and test\nsources. Added focused notes for [drive safeguards](drive-safeguards.md),\n[notification channels](notification-channels.md),\n[dashboard display](dashboard-display.md), and\n[telemetry interfaces](telemetry-interfaces.md).\n\n## 2026-11-23 · Ingest · hardware and software relationships\n\nMapped [wiring and Arduino ports](wiring-and-ports.md) against the wiring\nguide and firmware declarations. Added separately filterable relationships\nfor documented signals, test coverage, and code dependencies.","status":"unspecified","parent":"docs/wiki/README.md","depth":3,"domain":"docs/wiki/agent-governance.md"},{"id":"docs/wiki/notification-channels.md","title":"Notification channels","kind":"wiki","summary":"The same incident may produce several signals. The Arduino piezo plays manual horn, one-shot and repeating patterns. The ESCs may beep when the output gate detaches PWM. The dashboard displays safety banners and reports connection problems independently.","body":"# Notification channels\n\nThe same incident may produce several signals. The Arduino piezo plays\nmanual horn, one-shot and repeating patterns. The ESCs may beep when the\n[output gate](output-gate.md) detaches PWM. The\n[dashboard](dashboard-display.md) displays safety banners and reports\nconnection problems independently.\n\nThe repeating alarm order is thermal cutoff, low battery, thermal warning,\nthen RC off. A battery cutoff requests the low-battery pattern immediately.\nThermal recovery and Wi-Fi readiness each have a one-shot pattern.\nThe horn, one-shot pattern and active repeating alarm share a piezo output.\n\n- [Operator beep meanings](../../OPERATOR-GUIDE.md#beep-meanings-the-d8-buzzer)\n- [Battery ladder](battery-ladder.md) and [thermal derating](thermal-derating.md)","status":"unspecified","parent":"docs/wiki/alerts-and-alarms.md","depth":3,"domain":"docs/wiki/safety-system.md"},{"id":"docs/wiki/output-gate.md","title":"Output gate","kind":"wiki","summary":"The final authority between the mixer and the servo pins. When any closing condition fires — RC signal loss (sbus-input), battery cutoff, thermal cut, or the boot gate still awaiting battery confirmation — commands ease to neutral over a bounded ramp, then the servo signal detaches entirely (no pulses at all, which an ESC treats as signal loss, not as \"hold neutral\"). RC loss and thermal cut reopen the gate when…","body":"# Output gate\n\nThe final authority between the mixer and the servo pins. When any\nclosing condition fires — RC signal loss ([sbus-input](sbus-input.md)),\n[battery cutoff](battery-ladder.md), [thermal cut](thermal-derating.md), or\nthe boot gate still awaiting battery confirmation — commands ease to neutral\nover a bounded ramp, then the servo signal **detaches entirely** (no pulses\nat all, which an ESC treats as signal loss, not as \"hold neutral\"). RC loss\nand thermal cut reopen the gate when they clear; battery cutoff latches.\n\n- Current ramp timing and gate conditions: [CLAUDE.md](../../CLAUDE.md) and\n  [SAFETY](../SAFETY.md) (canonical)\n- Invariants: gate closed ⇒ neutral within the ramp window, then no pulses;\n  cutoff dominates any drive request in any [override\n  mode](override-modes.md) — tests in [testing](testing.md)\n- Every value written to the pins is double-bounded (float domain and\n  microsecond domain) — the \"outputs always in range\" invariant in\n  [SAFETY](../SAFETY.md)\n- Position in the chain: [control pipeline](control-pipeline.md)\n\nExplore [drive safeguards](drive-safeguards.md) for the watchdog, and for\nwhich behavior is enforced by tests or verified on the bench.\n\nThe boot-side counterpart: on power-up the gate waits for battery\nconfirmation but **fails open** after a bounded window, so the machine\nremains drivable with dead telemetry — a deliberate, documented trade-off\n([SAFETY](../SAFETY.md)).","status":"unspecified","parent":"docs/wiki/safety-system.md","depth":2,"domain":"docs/wiki/safety-system.md"},{"id":"docs/wiki/override-modes.md","title":"Override modes","kind":"wiki","summary":"Who is driving. A three-position switch on the RC transmitter selects the authority model: RC only, RC-overrides-joystick, or a blended mode where both inputs mix. This is how the supervisor (RC) can take over from the rider (joystick) at any moment — the core supervision mechanism for a child-ridden machine.","body":"# Override modes\n\nWho is driving. A three-position switch on the RC transmitter selects the\nauthority model: RC only, RC-overrides-joystick, or a blended mode where both\ninputs mix. This is how the supervisor (RC) can take over from the rider\n(joystick) at any moment — the core supervision mechanism for a child-ridden\nmachine.\n\n- Current mode mapping and blend behavior: [CLAUDE.md](../../CLAUDE.md)\n  (canonical); operator-facing description:\n  [OPERATOR-GUIDE](../../OPERATOR-GUIDE.md)\n- RC loss in any mode neutralizes RC's contribution via per-channel failsafe\n  ([sbus-input](sbus-input.md)); the stale-RC invariant is tested across all\n  modes ([SAFETY](../SAFETY.md) · [testing](testing.md))\n- Mode selection feeds the [control pipeline](control-pipeline.md) after\n  mixing, before [gear caps](gear-and-reverse-caps.md)\n\nSafety-relevant detail: the [battery cutoff](battery-ladder.md) and\n[output gate](output-gate.md) dominate **every** mode — no authority setting\ncan drive through a closed gate.","status":"unspecified","parent":"docs/wiki/control-pipeline.md","depth":2,"domain":"docs/wiki/control-pipeline.md"},{"id":"docs/wiki/ports-and-adapters.md","title":"Ports and adapters — the hardware boundary","kind":"wiki","summary":"How the firmware talks to hardware without the logic ever including a hardware header. Inventory with per-file notes: FILE-MAP.","body":"# Ports and adapters — the hardware boundary\n\nHow the firmware talks to hardware without the logic ever including a\nhardware header. Inventory with per-file notes:\n[FILE-MAP](../architecture/FILE-MAP.md).\n\n## The seam\n\nA **port** (`src/ports/`) is a small header of free functions and plain\ntypes — a contract stating WHAT the application needs (write these servo\nmicroseconds, read an RC frame, what time is it). An **adapter**\n(`src/infrastructure/`) implements it against the real hardware and is the\nONLY layer allowed to include Arduino, Wi-Fi, servo, S.BUS, or X.BUS\nheaders. Binding happens at link time — no virtual dispatch on the control\npath.\n\nAdapters are grouped by vendor/technology: the Arduino core adapters\n(PWM/servo, ADC joystick, piezo, clock, watchdog, serial console), the\nRadiolink S.BUS receiver (which owns the second UART and translates the\nvendor frame into the port's own `RcFrame` type at the boundary), the XC\nX.BUS telemetry poller, and the network stack (Wi-Fi service, dashboard\nserver, SSE stream).\n\n## Two details worth knowing\n\n- **Vendor types never cross the boundary.** Ports speak their own types;\n  the adapter translates at the edge (the S.BUS adapter is the precedent).\n- **One seam runs in reverse**: the network layer never encodes telemetry —\n  the application builds the JSON frame and the network adapter only ships\n  bytes, so infrastructure cannot reach into application state\n  ([telemetry-and-dashboard](telemetry-and-dashboard.md)).\n\nHost tests exploit the same seam: the stub environment implements the\nhardware side, and the suites compile the real firmware against it\n([testing](testing.md)).","status":"unspecified","parent":"docs/wiki/architecture-overview.md","depth":2,"domain":"docs/wiki/architecture-overview.md"},{"id":"docs/wiki/safety-system.md","title":"Safety system","kind":"wiki","summary":"Everything that can slow, stop, or refuse a drive command. The canonical, test-linked registry of what must ALWAYS hold is SAFETY — each invariant there has an executable host test (testing).","body":"# Safety system\n\nEverything that can slow, stop, or refuse a drive command. The canonical,\ntest-linked registry of what must ALWAYS hold is [SAFETY](../SAFETY.md) —\neach invariant there has an executable host test ([testing](testing.md)).\n\nLayers, from input to output:\n\n- Per-channel RC failsafe and stale-input neutralization\n  ([sbus-input](sbus-input.md))\n- [Battery ladder](battery-ladder.md) — staged response to falling pack\n  voltage, from forced-Eco to latched cutoff\n- [Thermal derating](thermal-derating.md) — staged response to ESC/motor\n  temperature, monotone by design\n- Plausibility gates — implausible voltage/temperature readings are never\n  trusted ([SAFETY](../SAFETY.md))\n- [Output gate](output-gate.md) — the final authority between the mixer and\n  the servo pins\n- Loop watchdog — born from a real incident (Wi-Fi stall while PWM held the\n  last throttle); the story is in [SAFETY](../SAFETY.md) and the fix in the\n  [DECISION-LOG](../DECISION-LOG.md)\n- [Alerts and alarms](alerts-and-alarms.md) — sound-only today, by design\n\nOperator-facing behavior (what the machine does when a layer trips):\n[OPERATOR-GUIDE](../../OPERATOR-GUIDE.md). Known, deliberately-unfixed gaps\nare documented in [SAFETY](../SAFETY.md) \"Known gaps\" — fixing one requires\nits own issue per the [governance rules](agent-governance.md).","status":"unspecified","parent":"docs/wiki/home.md","depth":1,"domain":"docs/wiki/safety-system.md"},{"id":"docs/wiki/sbus-input.md","title":"S.BUS input","kind":"wiki","summary":"All RC channels arrive on one wire: the receiver's S.BUS output — an electrically inverted UART protocol — passes through an NPN inverter on the interface board into a dedicated hardware UART on the Arduino. From one frame the firmware reads throttle, steering, the override mode switch, the gear switch, and the horn button.","body":"# S.BUS input\n\nAll RC channels arrive on one wire: the receiver's S.BUS output — an\nelectrically **inverted** UART protocol — passes through an NPN inverter on\nthe [interface board](hardware.md) into a dedicated hardware UART on the\nArduino. From one frame the firmware reads throttle, steering, the\n[override mode](override-modes.md) switch, the\n[gear](gear-and-reverse-caps.md) switch, and the horn button.\n\n- Current pins, UART instance naming, and frame parameters:\n  [CLAUDE.md](../../CLAUDE.md) \"UART Architecture\" (canonical); wiring:\n  [WIRING-GUIDE-V8](../WIRING-GUIDE-V8.md)\n- **Per-channel failsafe** — each channel times out independently, and the\n  receiver's failsafe flag is honored; stale or failsafed RC never produces\n  non-neutral propulsion ([SAFETY](../SAFETY.md) · [testing](testing.md))\n- Standing rule: hardware UARTs only, never `SoftwareSerial`\n  ([CLAUDE.md](../../CLAUDE.md) coding rules)\n- Position in the chain: [control pipeline](control-pipeline.md)","status":"unspecified","parent":"docs/wiki/control-pipeline.md","depth":2,"domain":"docs/wiki/control-pipeline.md"},{"id":"docs/wiki/telemetry-and-dashboard.md","title":"Telemetry and dashboard","kind":"wiki","summary":"Read-only observation path: the ESCs report voltage, current, RPM, and temperatures over X.BUS telemetry; the firmware smooths and streams them to the Wi-Fi dashboard.","body":"# Telemetry and dashboard\n\nRead-only observation path: the ESCs report voltage, current, RPM, and\ntemperatures over [X.BUS telemetry](xbus-telemetry.md); the firmware smooths\nand streams them to the [Wi-Fi dashboard](wifi-dashboard.md).\n\n**Wi-Fi is monitoring only.** The local [safety system](safety-system.md)\nuses ESC telemetry for derating and cutoff decisions. The network side\ncan observe those decisions and carries no track commands.\n\nUse this domain index to explore [X.BUS acquisition](xbus-telemetry.md),\n[Wi-Fi serving and the browser](wifi-dashboard.md), or\n[telemetry interfaces](telemetry-interfaces.md) for the JSON and CSV contracts.\n\n- [XBUS-PROTOCOL](../XBUS-PROTOCOL.md) — wire protocol reference\n- Dashboard source lives at `dashboard/index.html`, embedded into firmware as\n  `sketches/dual_track_control/web_page.h` (generated — edit the source, regenerate)\n- The platform is white-label (#136): product name, tagline, home-screen app\n  name, and accent colors live in ONE `BRANDING` block at the top of the\n  dashboard source — swapping a skin never touches logic. The default skin is\n  generic; vehicle-specific skins (the \"Malaki SuperTracks\" example is\n  documented in the block) are applied by editing only those values.\n- The version badge is injected at generation (#222): the source carries a\n  `{{FIRMWARE_VERSION}}` placeholder and the generator substitutes the\n  `BuildInfo.h` SSOT — a version bump without regeneration now fails the\n  drift check.\n- Dashboard rules (frame budget, UI testing before flashing):\n  [.claude/rules/dashboard](../../.claude/rules/dashboard.md)\n- Telemetry feeds the [battery ladder](battery-ladder.md) and\n  [thermal derating](thermal-derating.md); when telemetry drops out, those\n  ladders deliberately freeze ([SAFETY](../SAFETY.md))\n- Open latency work is hardware-gated:\n  [HANDOFF-V8-V9-WIFI-LATENCY-AND-OFFLOAD](../HANDOFF-V8-V9-WIFI-LATENCY-AND-OFFLOAD.md)","status":"unspecified","parent":"docs/wiki/home.md","depth":1,"domain":"docs/wiki/telemetry-and-dashboard.md"},{"id":"docs/wiki/telemetry-interfaces.md","title":"Telemetry interfaces","kind":"wiki","summary":"Follow the data from X.BUS acquisition through the firmware snapshot to its consumers. The snapshot captures operator inputs, drive commands, mode, protection flags, and both ESC readings.","body":"# Telemetry interfaces\n\nFollow the data from [X.BUS acquisition](xbus-telemetry.md) through the\nfirmware snapshot to its consumers. The snapshot captures operator inputs,\ndrive commands, mode, protection flags, and both ESC readings.\n\n- **Dashboard JSON** is shared by the one-shot snapshot and the event\n  stream. It exposes separate ESC validity and age, raw receiver flags,\n  safety stages, commanded PWM, and compact measurements.\n- **Serial CSV** is the local debug view. It includes the input channels\n  and raw joystick readings, plus the output and ESC observations.\n  Motor speed in CSV is electrical frequency; dashboard JSON converts it\n  to the displayed RPM.\n- [Wi-Fi dashboard](wifi-dashboard.md) covers delivery and buffering.\n  [Dashboard display](dashboard-display.md) covers scale and freshness in\n  the browser. [Tools](../../tools/README.md) indexes serial and replay tools.","status":"unspecified","parent":"docs/wiki/telemetry-and-dashboard.md","depth":2,"domain":"docs/wiki/telemetry-and-dashboard.md"},{"id":"docs/wiki/testing.md","title":"Testing","kind":"wiki","summary":"Host-side suites that compile the real firmware (dual_track_control.ino) against stub Arduino headers — no hardware needed. Canonical guide, commands, and the commit gate: TESTING.","body":"# Testing\n\nHost-side suites that compile the **real firmware** (`dual_track_control.ino`) against\nstub Arduino headers — no hardware needed. Canonical guide, commands, and the\ncommit gate: [TESTING](../TESTING.md).\n\n- **Characterization suite** (`tests/characterization/`) — locks current\n  behavior; the parity gate for every firmware-touching PR\n- **Invariant suite** (`tests/invariants/`) — property tests + fault\n  injection for the [safety system](safety-system.md); each maps to a row in\n  [SAFETY](../SAFETY.md)\n- **Commit gate** — `.githooks/pre-commit` blocks red suites and firmware\n  changes without test changes\n- **CI** — the same suites run in the `unit-tests` workflow alongside\n  compile, lint, static-analysis, and structure checks; the\n  `architecture-fitness` workflow additionally enforces the\n  [target architecture's](architecture-remediation.md) dependency, file-size,\n  and naming rules with a self-testing checker\n\n**Test expectations are behavior law**: changing an expected value is a\nbehavior change requiring its own issue and operator sign-off — the core of\nthe [governance covenant](agent-governance.md). What cannot be tested on the\nhost (physical behavior) is deferred to a bench pass:\n[BENCH-VERIFICATION-DEFERRED](../architecture/BENCH-VERIFICATION-DEFERRED.md).\nDashboard UI has its own local test path (Playwright screenshots) per\n[.claude/rules/dashboard](../../.claude/rules/dashboard.md).","status":"unspecified","parent":"docs/wiki/home.md","depth":1,"domain":"docs/wiki/testing.md"},{"id":"docs/wiki/thermal-derating.md","title":"Thermal derating","kind":"wiki","summary":"Staged response to ESC and motor temperature — monotone by design: a rising thermal stage never increases allowed propulsion. Stages run from a warning, through a forced-Eco cap (gear and reverse caps), to a full thermal cut via the output gate. Each stage trips after a debounce and releases with hysteresis — the machine holding a reduced stage anywhere inside its hysteresis band is correct behavior, not a stuck…","body":"# Thermal derating\n\nStaged response to ESC and motor temperature — **monotone by design**: a\nrising thermal stage never increases allowed propulsion. Stages run from a\nwarning, through a forced-Eco cap ([gear and reverse\ncaps](gear-and-reverse-caps.md)), to a full thermal cut via the\n[output gate](output-gate.md). Each stage trips after a debounce and releases\nwith **hysteresis** — the machine holding a reduced stage anywhere inside its\nhysteresis band is correct behavior, not a stuck state.\n\n- Current stage temperatures, debounce, and release bands:\n  [CLAUDE.md](../../CLAUDE.md) and [SAFETY](../SAFETY.md) (canonical)\n- The monotonicity invariant and its tests: [SAFETY](../SAFETY.md) ·\n  [testing](testing.md)\n- Temperatures arrive via [X.BUS telemetry](xbus-telemetry.md); implausible\n  spikes are rejected, and dropout freezes the active stage rather than\n  releasing it. The hysteresis stage, hottest-sensor selection, and staging\n  logic were extracted into domain code (`src/domain/thermal/`) as part of\n  the [architecture remediation](architecture-remediation.md); the sketch\n  keeps thin delegates\n\nDeliberate asymmetry with the [battery ladder](battery-ladder.md): thermal\ncut **auto-recovers** when temperature falls; battery cutoff latches until\npower-cycle. Both intended, both test-locked.","status":"unspecified","parent":"docs/wiki/safety-system.md","depth":2,"domain":"docs/wiki/safety-system.md"},{"id":"docs/wiki/wifi-dashboard.md","title":"Wi-Fi dashboard","kind":"wiki","summary":"The UNO R4 WiFi hosts its own access point and serves a single-page dashboard streaming live telemetry over Server-Sent Events. Monitoring only, permanently — there is no control input over Wi-Fi, and no code path from the network to motor output (telemetry and dashboard).","body":"# Wi-Fi dashboard\n\nThe UNO R4 WiFi hosts its own access point and serves a single-page\ndashboard streaming live telemetry over Server-Sent Events. **Monitoring\nonly, permanently** — there is no control input over Wi-Fi, and no code path\nfrom the network to motor output\n([telemetry and dashboard](telemetry-and-dashboard.md)).\n\n- [Dashboard display and status](dashboard-display.md) — gauges, freshness,\n  connection recovery, and browser safety indicators.\n- Current AP name, addresses, stream cadence, and endpoints:\n  [CLAUDE.md](../../CLAUDE.md) (canonical)\n- Source of truth for the page is `dashboard/index.html`;\n  `sketches/dual_track_control/web_page.h` is generated from it — never hand-edited\n- Code home: the serving machine (AP bring-up, routing, incremental page\n  transfer, SSE) is `src/infrastructure/network/` behind\n  `src/ports/DashboardServicePort.h`; the JSON flows the other way through\n  `src/ports/TelemetryFrameSource.h` — the application encodes, the network\n  layer ships bytes ([architecture\n  remediation](architecture-remediation.md), #181)\n- Rules (SSE frame budget, wire-format keys, local Playwright screenshot\n  testing BEFORE flashing):\n  [.claude/rules/dashboard](../../.claude/rules/dashboard.md)\n- History: a blocking page send once froze the control loop and became the\n  motivating incident for the loop watchdog\n  ([safety system](safety-system.md), [SAFETY](../SAFETY.md)); serving is\n  incremental and bounded since — details in the\n  [DECISION-LOG](../DECISION-LOG.md)\n- Open latency investigation (hardware-gated):\n  [HANDOFF-V8-V9-WIFI-LATENCY-AND-OFFLOAD](../HANDOFF-V8-V9-WIFI-LATENCY-AND-OFFLOAD.md)","status":"unspecified","parent":"docs/wiki/telemetry-and-dashboard.md","depth":2,"domain":"docs/wiki/telemetry-and-dashboard.md"},{"id":"docs/wiki/wiring-and-ports.md","title":"Wiring and Arduino ports","kind":"wiki","summary":"This topic connects the receiver, joystick, ESCs, interface board, and beeper to the Uno R4 WiFi interfaces they use. Each link records the signal direction, the documented route, and its source. The receiver reaches the Arduino through the interface board inverter. The ESC throttle signals and their shared telemetry bus are separate paths.","body":"# Wiring and Arduino ports\n\nThis topic connects the receiver, joystick, ESCs, interface board, and\nbeeper to the Uno R4 WiFi interfaces they use. Each link records the\nsignal direction, the documented route, and its source. The receiver\nreaches the Arduino through the interface board inverter. The ESC throttle\nsignals and their shared telemetry bus are separate paths.\n\nSelect **Wiring** in the explorer to trace these connections in either\ndirection. The [wiring guide](../WIRING-GUIDE-V8.md) records the pin and\nUART assignments. The [netlist](../INTERFACE-BOARD-NETLIST.md) describes\nthe interface board connectors and shared nets.","status":"unspecified","parent":"docs/wiki/hardware.md","depth":2,"domain":"docs/wiki/hardware.md"},{"id":"docs/wiki/xbus-telemetry.md","title":"X.BUS telemetry","kind":"wiki","summary":"How the firmware reads voltage, current, RPM, and temperatures from both ESCs without ever taking control authority: it polls the GL10's Read Register function over a shared half-duplex UART bus. The critical protocol choice — Read Register is point-to-point service traffic that never puts the ESC into bus-control mode, so PWM command authority is fully preserved. The throttle-over-bus function would fight our…","body":"# X.BUS telemetry\n\nHow the firmware reads voltage, current, RPM, and temperatures from both\nESCs without ever taking control authority: it polls the GL10's **Read\nRegister** function over a shared half-duplex UART bus. The critical protocol\nchoice — Read Register is point-to-point service traffic that never puts the\nESC into bus-control mode, so PWM command authority is fully preserved. The\nthrottle-over-bus function would fight our PWM and is never used.\n\n- Wire protocol, framing, and register map:\n  [XBUS-PROTOCOL](../XBUS-PROTOCOL.md) (canonical)\n- Current registers polled, cadence, smoothing, and freshness watchdog:\n  [CLAUDE.md](../../CLAUDE.md) \"Telemetry\"\n- Code home: the poller (framing, checksum, parse, EMA, poll state machine)\n  is `src/infrastructure/xc/XbusTelemetryAdapter` behind\n  `src/ports/TelemetrySource.h`; the sketch owns the telemetry array\n  ([architecture remediation](architecture-remediation.md), slice 4)\n- Consumers: the [battery ladder](battery-ladder.md),\n  [thermal derating](thermal-derating.md), and the\n  [Wi-Fi dashboard](wifi-dashboard.md) — monitoring-only by permanent\n  decision ([telemetry and dashboard](telemetry-and-dashboard.md))\n- Plausibility gates reject implausible readings — with one documented\n  exception: NaN pack voltage passes the voltage band ([SAFETY](../SAFETY.md)\n  \"Known gaps\"; unreachable today via the integer parse path). Dropout\n  freezes the safety ladders rather than releasing them.\n- Bus wiring and the X.BUS merge on the interface board:\n  [hardware](hardware.md)","status":"unspecified","parent":"docs/wiki/telemetry-and-dashboard.md","depth":2,"domain":"docs/wiki/telemetry-and-dashboard.md"},{"id":"scripts/generate_web_page.py","title":"generate_web_page.py","kind":"file","summary":""},{"id":"sketches/dual_track_control/dual_track_contr
