<script type="application/json" id="knowledge">{"cards":{"Safety":[{"label":"Drive permission","description":"The first blocking reason wins: invalid RC, battery startup gate, battery cutoff, then thermal cutoff. The RC frame becomes stale after 100 ms. The loop watchdog resets the MCU after 250 ms without service.","sources":[{"path":"sketches/dual_track_control/src/application/FirmwareApp.cpp"},{"path":"sketches/dual_track_control/src/application/OperatorInput.h","line":14},{"path":"sketches/dual_track_control/src/config/SafetyConfig.h","line":12},{"path":"sketches/dual_track_control/src/domain/safety/SafetySupervisor.cpp"}]},{"label":"What cutoff actually does","description":"Both ESC commands ramp from their last written values to 1500 µs over 500 ms, then PWM detaches. Battery power remains connected. The ESCs can sound their own loss-of-signal beep.","sources":[{"path":"sketches/dual_track_control/src/application/MotorOutput.cpp"},{"path":"sketches/dual_track_control/src/config/BatteryConfig.h","line":14},{"path":"sketches/dual_track_control/src/config/DriveConfig.h","line":6},{"path":"sketches/dual_track_control/src/domain/safety/OutputGate.cpp"}]},{"label":"Drive recovery","description":"RC recovery and cooling can reopen the gate when other conditions allow. Battery Eco and battery cutoff latch until power-cycle. After boot, both packs must supply plausible readings with the lower pack at or above 10.0 V, or the boot gate times out after 3000 ms.","sources":[{"path":"sketches/dual_track_control/src/config/BatteryConfig.h","line":12},{"path":"sketches/dual_track_control/src/config/BatteryConfig.h","line":20},{"path":"sketches/dual_track_control/src/domain/battery/BatteryLadder.cpp"},{"path":"sketches/dual_track_control/src/domain/safety/SafetySupervisor.cpp"}]}],"Thermal stages":[{"label":"Warning · sound only","description":"Trips at ≥ 80.0 °C for 1000 ms. Clears below 78.0 °C. Plays the warning trill when it has priority.","sources":[{"path":"sketches/dual_track_control/src/alerts/AlertPolicy.cpp"},{"path":"sketches/dual_track_control/src/config/ThermalConfig.h","line":21},{"path":"sketches/dual_track_control/src/config/ThermalConfig.h","line":22},{"path":"sketches/dual_track_control/src/config/ThermalConfig.h","line":27},{"path":"sketches/dual_track_control/src/domain/thermal/ThermalDerating.cpp"},{"path":"sketches/dual_track_control/src/domain/thermal/ThermalHysteresis.cpp"}]},{"label":"Throttle · forced Eco","description":"Trips at ≥ 90.0 °C for 1000 ms. Clears below 80.0 °C. Forces Eco gear (scale 0.65 of average track command).","sources":[{"path":"sketches/dual_track_control/src/application/OperatorInput.cpp"},{"path":"sketches/dual_track_control/src/config/DriveConfig.h","line":46},{"path":"sketches/dual_track_control/src/config/ThermalConfig.h","line":23},{"path":"sketches/dual_track_control/src/config/ThermalConfig.h","line":24},{"path":"sketches/dual_track_control/src/config/ThermalConfig.h","line":27},{"path":"sketches/dual_track_control/src/domain/thermal/ThermalDerating.cpp"},{"path":"sketches/dual_track_control/src/domain/thermal/ThermalHysteresis.cpp"}]},{"label":"Cutoff · stop propulsion","description":"Trips at ≥ 95.0 °C for 1000 ms. Clears below 75.0 °C. Commands the output gate to stop propulsion, plays the three-long-beep alarm, then queues the recovery flourish when the stage releases. The cutoff setting is provisional in firmware comments. The GL10’s internal thermal limit is unpublished.","sources":[{"path":"sketches/dual_track_control/src/alerts/AlertPolicy.cpp"},{"path":"sketches/dual_track_control/src/application/SafetyControl.cpp"},{"path":"sketches/dual_track_control/src/config/ThermalConfig.h","line":25},{"path":"sketches/dual_track_control/src/config/ThermalConfig.h","line":26},{"path":"sketches/dual_track_control/src/config/ThermalConfig.h","line":27},{"path":"sketches/dual_track_control/src/domain/safety/OutputGate.cpp"},{"path":"sketches/dual_track_control/src/domain/thermal/ThermalDerating.cpp"},{"path":"sketches/dual_track_control/src/domain/thermal/ThermalHysteresis.cpp"}]},{"label":"Sensor selection","description":"Uses the hottest plausible smoothed ESC or motor temperature from either valid ESC. Accepts -20.0 to 200.0 °C inclusive. With no valid plausible reading, stages hold.","sources":[{"path":"sketches/dual_track_control/src/application/SafetyControl.cpp"},{"path":"sketches/dual_track_control/src/config/ThermalConfig.h","line":28},{"path":"sketches/dual_track_control/src/config/ThermalConfig.h","line":29},{"path":"sketches/dual_track_control/src/domain/thermal/ThermalDerating.cpp"}]}],"Battery thresholds":[{"label":"Throttle · forced Eco","description":"Lower pack voltage \u003c 10.8 V for 15000 ms forces Eco until power-cycle.","sources":[{"path":"sketches/dual_track_control/src/config/BatteryConfig.h","line":28},{"path":"sketches/dual_track_control/src/config/BatteryConfig.h","line":29},{"path":"sketches/dual_track_control/src/domain/battery/BatteryLadder.cpp"}]},{"label":"Warning · sound only","description":"Lower pack voltage \u003c 10.5 V for 3000 ms latches the low-battery chirps after a 60000 ms startup grace.","sources":[{"path":"sketches/dual_track_control/src/alerts/AlertPolicy.cpp"},{"path":"sketches/dual_track_control/src/config/AlertConfig.h","line":29},{"path":"sketches/dual_track_control/src/config/AlertConfig.h","line":32},{"path":"sketches/dual_track_control/src/config/AlertConfig.h","line":33}]},{"label":"Cutoff · stop propulsion","description":"Lower pack voltage \u003c 10.0 V for 1500 ms latches cutoff and requests low-battery chirps immediately. The motor protection has its own validity checks and runs during the audible alarm’s startup grace.","sources":[{"path":"sketches/dual_track_control/src/application/SafetyControl.cpp"},{"path":"sketches/dual_track_control/src/config/BatteryConfig.h","line":12},{"path":"sketches/dual_track_control/src/config/BatteryConfig.h","line":13},{"path":"sketches/dual_track_control/src/domain/battery/BatteryLadder.cpp"},{"path":"sketches/dual_track_control/src/domain/safety/OutputGate.cpp"}]},{"label":"Reading validity","description":"Uses the lower smoothed voltage of two valid packs. The configured plausibility band is 6.0–13.0 V inclusive. Invalid readings reset the pending battery debounce. Already latched stages hold.","sources":[{"path":"sketches/dual_track_control/src/alerts/AlertPolicy.cpp"},{"path":"sketches/dual_track_control/src/config/AlertConfig.h","line":30},{"path":"sketches/dual_track_control/src/config/AlertConfig.h","line":31},{"path":"sketches/dual_track_control/src/domain/battery/BatteryLadder.cpp"},{"path":"sketches/dual_track_control/src/domain/battery/VoltagePlausibility.cpp"}]}],"Beeps":[{"label":"Priority and output","description":"Repeating priority: thermal cutoff → low battery/battery cutoff → thermal warning → RC off. Manual horn, one-shot patterns, and the selected repeating alarm share D8; any active output drives the piezo. Horn: valid RC and its horn channel above 1400 raw.","sources":[{"path":"sketches/dual_track_control/src/alerts/AlertPolicy.cpp"},{"path":"sketches/dual_track_control/src/application/AlertControl.cpp"},{"path":"sketches/dual_track_control/src/application/FirmwareApp.cpp"},{"path":"sketches/dual_track_control/src/config/InputConfig.h","line":19},{"path":"sketches/dual_track_control/src/config/Pins.h","line":17}]},{"label":"Thermal cutoff · three long","description":"Repeats while the thermal cutoff alarm has priority. On/off phases (ms): 500 / 150 / 500 / 150 / 500 / 1000.","sources":[{"path":"sketches/dual_track_control/src/alerts/AlertPolicy.cpp"},{"path":"sketches/dual_track_control/src/config/AlertConfig.h","line":22}]},{"label":"Low battery · three short","description":"Repeats until power-cycle when selected. On/off phases (ms): 120 / 120 / 120 / 120 / 120 / 600.","sources":[{"path":"sketches/dual_track_control/src/alerts/AlertPolicy.cpp"},{"path":"sketches/dual_track_control/src/config/AlertConfig.h","line":16}]},{"label":"Thermal warning · trill","description":"Repeats while selected. On/off phases (ms): 100 / 100.","sources":[{"path":"sketches/dual_track_control/src/alerts/AlertPolicy.cpp"},{"path":"sketches/dual_track_control/src/config/AlertConfig.h","line":20}]},{"label":"RC off · one long","description":"Starts after 60000 ms without valid RC. Clears when valid RC returns. On/off phases (ms): 500 / 1500.","sources":[{"path":"sketches/dual_track_control/src/alerts/AlertPolicy.cpp"},{"path":"sketches/dual_track_control/src/config/AlertConfig.h","line":14},{"path":"sketches/dual_track_control/src/config/AlertConfig.h","line":28}]},{"label":"Thermal recovery · four quick","description":"One-shot when thermal cutoff clears. On/off phases (ms): 120 / 100 / 120 / 100 / 120 / 100 / 120 / 1500.","sources":[{"path":"sketches/dual_track_control/src/alerts/PatternPlayer.cpp"},{"path":"sketches/dual_track_control/src/application/SafetyControl.cpp"},{"path":"sketches/dual_track_control/src/config/AlertConfig.h","line":24}]},{"label":"Wi-Fi ready · two short","description":"One-shot when Wi-Fi is ready. On/off phases (ms): 180 / 140 / 180.","sources":[{"path":"sketches/dual_track_control/src/alerts/PatternPlayer.cpp"},{"path":"sketches/dual_track_control/src/config/AlertConfig.h","line":9},{"path":"sketches/dual_track_control/src/infrastructure/network/WifiService.cpp"}]}],"Data and API":[{"label":"Dashboard snapshot and event stream","description":"GET /data (JSON) · GET /events (server-sent events). The SSE stream sends the same JSON shape every 200 ms when servicing a client. These are read-only observation routes. The server falls back to the dashboard page for other requests.","sources":[{"path":"sketches/dual_track_control/src/infrastructure/network/DashboardServer.cpp"},{"path":"sketches/dual_track_control/src/infrastructure/network/SseStream.cpp"},{"path":"sketches/dual_track_control/src/infrastructure/network/WifiService.h","line":15}]},{"label":"Frame metadata","description":"t is the controller time in ms, seq is the sequence of built JSON frames, gear is the active gear, and mode is the operator authority mode.","sources":[{"path":"sketches/dual_track_control/src/telemetry/JsonEncoder.cpp"}]},{"label":"Safety fields","description":"Raw RC receiver failsafe/lost-frame flags: fs, lost. Battery: eco, cut. Thermal: hot, teco, tcut. Last written servo pulses in µs: outL, outR. Flags encode zero or one.","sources":[{"path":"sketches/dual_track_control/src/telemetry/JsonEncoder.cpp"}]},{"label":"ESC measurements","description":"e0 and e1 carry validity (ok), age in ms, mechanical rpm, current in tenths of an amp (cur), voltage in tenths of a volt (v), and whole °C temperatures (tE = ESC, tM = motor). X.BUS data becomes invalid after 5000 ms without a good reply.","sources":[{"path":"sketches/dual_track_control/src/infrastructure/xc/XbusTelemetryAdapter.cpp"},{"path":"sketches/dual_track_control/src/infrastructure/xc/XbusTelemetryAdapter.h","line":38},{"path":"sketches/dual_track_control/src/telemetry/JsonEncoder.cpp"}]},{"label":"JSON keys in the firmware encoder","description":"t, seq, gear, mode, fs, lost, eco, cut, hot, teco, tcut, outL, outR, e0, ok, age, rpm, cur, v, tE, tM, e1.","sources":[{"path":"sketches/dual_track_control/src/telemetry/JsonEncoder.cpp"}]}],"Control safeguards":[{"label":"Control order","description":"Read RC, evaluate battery and thermal protection, select gear, sample joystick, mix inputs, and apply the output gate. Service the watchdog after output, then run telemetry, Wi-Fi, alerts and debug.","sources":[{"path":"sketches/dual_track_control/src/application/FirmwareApp.cpp"}]},{"label":"Receiver flags","description":"A frame carrying the receiver failsafe flag invalidates RC immediately. The stale timer separately invalidates RC when frames stop. The lost-frame bit is recorded for diagnostics and does not independently close the gate.","sources":[{"path":"sketches/dual_track_control/src/application/FirmwareApp.cpp"},{"path":"sketches/dual_track_control/src/infrastructure/radiolink/SbusReceiverAdapter.cpp"}]},{"label":"Authority modes","description":"The mapped CH5 switch selects remote only, joystick with RC override, or shared control. In shared control, each axis uses the stronger same-direction command or combines opposing commands so they can cancel. Valid RC is required in all modes.","sources":[{"path":"sketches/dual_track_control/src/application/OperatorInput.cpp"},{"path":"sketches/dual_track_control/src/domain/drive/CommandMixer.cpp"}]},{"label":"Output limits and gear","description":"PWM conversion and output both clamp commands to the servo rails. Gear and reverse limits apply to the average track command, with intentional per-track turning headroom. Forced Eco overrides the selected gear.","sources":[{"path":"sketches/dual_track_control/src/application/OperatorInput.cpp"},{"path":"sketches/dual_track_control/src/application/MotorOutput.cpp"},{"path":"sketches/dual_track_control/src/domain/drive/GearPolicy.cpp"}]},{"label":"Watchdog and bench evidence","description":"The hardware watchdog arms after Wi-Fi startup and is refreshed once per control pass after the gate. Host tests check the refresh contract. Physical reset and ESC response belong to bench verification.","sources":[{"path":"sketches/dual_track_control/src/application/FirmwareApp.cpp"},{"path":"docs/SAFETY.md"},{"path":"docs/architecture/BENCH-VERIFICATION-DEFERRED.md"}]},{"label":"Known limitations","description":"The safety registry records a slot-dependent NaN case in the pack plausibility helper and a short reverse-cap transient on joystick cache during upshift. The production X.BUS integer decoder cannot generate a NaN pack voltage.","sources":[{"path":"docs/SAFETY.md"},{"path":"tests/invariants/test_invariant_plausibility.cpp"},{"path":"tests/invariants/test_invariant_gear_reverse_caps.cpp"}]}],"Notification channels":[{"label":"Piezo, ESC and dashboard","description":"The Arduino piezo combines the manual horn, one queued one-shot, and the selected repeating alarm. ESC loss-of-PWM beeps come from the ESCs. The browser renders its own safety banners from firmware flags and reports connection or JSON/render errors separately.","sources":[{"path":"sketches/dual_track_control/src/application/AlertControl.cpp"},{"path":"sketches/dual_track_control/src/application/MotorOutput.cpp"},{"path":"dashboard/index.html"}]},{"label":"Pattern playback","description":"The policy selects a repeating alarm by priority. Durations alternate ON and OFF, and a repeating sequence starts at its first phase when the selected sequence changes. A new one-shot takes over the one-shot slot. The manual horn can mask pauses in both paths.","sources":[{"path":"sketches/dual_track_control/src/application/AlertControl.cpp"},{"path":"sketches/dual_track_control/src/alerts/PatternPlayer.cpp"},{"path":"sketches/dual_track_control/src/alerts/AlertPolicy.cpp"}]},{"label":"Diagnostic notifications","description":"The controller prints a watchdog armed/failure message at startup, Wi-Fi status periodically, and adapter startup messages. The browser has a reconnect button and reports connection state separately from motor protection.","sources":[{"path":"sketches/dual_track_control/src/application/FirmwareApp.cpp"},{"path":"sketches/dual_track_control/src/application/Monitoring.cpp"},{"path":"sketches/dual_track_control/src/infrastructure/network/WifiService.cpp"},{"path":"dashboard/index.html"}]}],"Dashboard display":[{"label":"Track panels","description":"Left and right show ESC temperature, motor temperature, measured speed and power estimated as volts × amps. Temperatures have display color bands. Each pack has independent voltage, voltage-derived charge percentage, gauge and color.","sources":[{"path":"dashboard/index.html"}]},{"label":"Speed, direction and commanded throttle","description":"Vehicle speed estimates km/h from the average of signed track RPM, gear reduction and wheel circumference. Track arrows and vehicle heading use PWM commands, with a neutral dead zone. Bottom bars show signed left/right throttle, summed current, summed power and time since the first received browser frame.","sources":[{"path":"dashboard/index.html"}]},{"label":"Gear, authority and version","description":"Gear badges reflect the effective firmware gear, including forced Eco. Authority pills display the telemetry mode, and the version badge is injected from BuildInfo during dashboard generation. The BRANDING block controls names and accents.","sources":[{"path":"dashboard/index.html"},{"path":"sketches/dual_track_control/src/config/BuildInfo.h"},{"path":"scripts/generate_web_page.py"}]},{"label":"Freshness and smoothing","description":"A stale ESC panel dims and keeps its previous values. Measurements arriving in tenths are divided by ten. A continuous animation eases display values toward their last accepted targets. The firmware has a separate, longer X.BUS validity timer.","sources":[{"path":"dashboard/index.html"},{"path":"sketches/dual_track_control/src/infrastructure/xc/XbusTelemetryAdapter.cpp"}]},{"label":"Safety banner priority","description":"Thermal cut → battery cut → thermal Eco → battery Eco → thermal warning → a brief thermal-restored banner. The browser selects the hottest displayed sensor label for heat messages. Banners reflect observed flags; browser status cannot open the output gate.","sources":[{"path":"dashboard/index.html"},{"path":"sketches/dual_track_control/src/telemetry/JsonEncoder.cpp"}]},{"label":"Connection and recovery","description":"The browser opens EventSource on the Arduino. It labels a quiet stream OFFLINE, forces reconnect when received frames stop for longer, and can reconnect manually. Parsing and rendering failures are shown in a separate connection banner.","sources":[{"path":"dashboard/index.html"}]}],"Wi-Fi service":[{"label":"AP and static page","description":"The Arduino hosts the read-only Wi-Fi AP and HTTP dashboard. The embedded page is served in chunks between control passes. The static page uses a content ETag and can return 304 on a matching conditional request. A client disconnect or zero-byte write aborts a page transfer.","sources":[{"path":"sketches/dual_track_control/src/infrastructure/network/WifiService.cpp"},{"path":"sketches/dual_track_control/src/infrastructure/network/DashboardServer.cpp"},{"path":"sketches/dual_track_control/src/application/Monitoring.cpp"}]},{"label":"Snapshot and SSE","description":"GET /data returns application/json and closes its socket. GET /events returns text/event-stream and keeps its socket. Both share the JSON encoder and allow cross-origin reads. SSE holds one persistent client, replaces any prior socket, sends a heartbeat comment with each data message, and closes disconnected sockets or sockets whose write returns zero.","sources":[{"path":"sketches/dual_track_control/src/infrastructure/network/DashboardServer.cpp"},{"path":"sketches/dual_track_control/src/infrastructure/network/SseStream.cpp"},{"path":"sketches/dual_track_control/src/telemetry/JsonEncoder.cpp"}]}],"X.BUS pipeline":[{"label":"Request and parser","description":"Serial1 sends a point-to-point register read with an outgoing checksum, alternating controllers. The receiving parser screens for slave header, target address, read function, and complete register triplets. Its acceptance check does not verify a reply checksum.","sources":[{"path":"sketches/dual_track_control/src/infrastructure/xc/XbusTelemetryAdapter.cpp"},{"path":"sketches/dual_track_control/src/infrastructure/xc/XbusTelemetryAdapter.h"},{"path":"docs/XBUS-PROTOCOL.md"}]},{"label":"Polling and freshness","description":"The adapter runs across control iterations. A reply or timeout advances to the next ESC, and a good reply updates validity and last-good time. The firmware may mark one ESC stale while the other remains valid.","sources":[{"path":"sketches/dual_track_control/src/infrastructure/xc/XbusTelemetryAdapter.cpp"},{"path":"sketches/dual_track_control/src/infrastructure/xc/XbusTelemetryAdapter.h"}]},{"label":"Register decoding","description":"Voltage is unsigned in tenths of a volt, current is signed in tenths of an amp, and speed is signed electrical Hz. Temperatures use the low byte with a −40 °C offset. Voltage, current and temperatures use per-ESC exponential averages; speed is instantaneous.","sources":[{"path":"sketches/dual_track_control/src/infrastructure/xc/XbusTelemetryAdapter.cpp"},{"path":"sketches/dual_track_control/src/infrastructure/xc/XbusTelemetryAdapter.h"},{"path":"sketches/dual_track_control/src/telemetry/TelemetryScaling.h"}]},{"label":"Consumers","description":"The local protection and alert logic use smoothed voltage and temperature. Monitoring snapshots copy inputs, commanded outputs, mode, flags and both ESC readings for JSON or CSV encoders. The browser has no motor control path.","sources":[{"path":"sketches/dual_track_control/src/application/SafetyControl.cpp"},{"path":"sketches/dual_track_control/src/application/AlertControl.cpp"},{"path":"sketches/dual_track_control/src/application/Monitoring.cpp"},{"path":"sketches/dual_track_control/src/application/SystemSnapshot.h"}]}],"Serial diagnostics":[{"label":"CSV output","description":"The USB debug observer periodically writes one comma-separated snapshot when the console is ready. It includes input pulse equivalents, joystick raw ADC, output PWM, gear, raw receiver flags and both ESC measurements. CSV carries electrical Hz rather than the dashboard’s RPM conversion.","sources":[{"path":"sketches/dual_track_control/src/application/Monitoring.cpp"},{"path":"sketches/dual_track_control/src/telemetry/CsvEncoder.cpp"},{"path":"sketches/dual_track_control/src/config/TelemetryConfig.h"}]},{"label":"Bench tooling","description":"The repository includes serial monitoring and telemetry plotting tools, standalone sketches for decoding and checking the bus, and replay tooling and UI checks for the dashboard.","sources":[{"path":"tools/README.md"},{"path":"tools/monitor.py"},{"path":"tools/live_plot_telemetry.py"},{"path":"sketches/README.md"}]}],"JSON fields":[{"label":"t","description":"Controller time in ms at observation.","sources":[{"path":"sketches/dual_track_control/src/telemetry/JsonEncoder.cpp","line":19}]},{"label":"seq","description":"Sequence incremented for each built JSON frame, shared by snapshot and stream.","sources":[{"path":"sketches/dual_track_control/src/telemetry/JsonEncoder.cpp","line":19}]},{"label":"gear","description":"Effective gear enum: 0 Eco, 1 Normal, 2 Boost.","sources":[{"path":"sketches/dual_track_control/src/telemetry/JsonEncoder.cpp","line":19}]},{"label":"mode","description":"Authority: 0 RC, 1 joystick/RC override, 2 shared control.","sources":[{"path":"sketches/dual_track_control/src/telemetry/JsonEncoder.cpp","line":19}]},{"label":"fs","description":"Raw receiver failsafe flag (0/1). This is distinct from the internal RC stale timer.","sources":[{"path":"sketches/dual_track_control/src/telemetry/JsonEncoder.cpp","line":19}]},{"label":"lost","description":"Raw lost-frame flag (0/1).","sources":[{"path":"sketches/dual_track_control/src/telemetry/JsonEncoder.cpp","line":19}]},{"label":"eco","description":"Latched low-voltage Eco stage (0/1).","sources":[{"path":"sketches/dual_track_control/src/telemetry/JsonEncoder.cpp","line":20}]},{"label":"cut","description":"Latched low-voltage drive cutoff (0/1).","sources":[{"path":"sketches/dual_track_control/src/telemetry/JsonEncoder.cpp","line":20}]},{"label":"hot","description":"Thermal warning stage (0/1).","sources":[{"path":"sketches/dual_track_control/src/telemetry/JsonEncoder.cpp","line":20}]},{"label":"teco","description":"Thermal Eco stage (0/1).","sources":[{"path":"sketches/dual_track_control/src/telemetry/JsonEncoder.cpp","line":20}]},{"label":"tcut","description":"Thermal drive cutoff (0/1).","sources":[{"path":"sketches/dual_track_control/src/tel  arduino:['Arduino UNO R4 WiFi','Reads the joystick and RC receiver, commands both ESCs, and runs the safety gate.', ['Safety','Control safeguards','Data and API'], ['D9 → left ESC PWM; D10 → right ESC PWM','A0 ← throttle; A1 ← steering','D12 ← S.BUS receiver through the interface board; D11 is reserved TX','D0 RX / D1 TX ↔ X.BUS via Serial1 and the interface board','D8 → piezo; USB-C → debug/upload']],

};

const faces=[], routes=[], marks={};
function face(v,color,id){faces.push({v,color,id});}
function box(x,y,z,w,h,d,col,id){const v=[[x,y,z],[x+w,y,z],[x+w,y,z+d],[x,y,z+d],[x,y+h,z],[x+w,y+h,z],[x+w,y+h,z+d],[x,y+h,z+d]];[[0,3,2,1],[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7],[4,5,6,7]].forEach((q,i)=>face(q.map(j=>v[j]),shade(col,[.55,.8,.69,.72,.88,1.15][i]),id));}
function shade(hex,k){return '#'+hex.match(/../g).map(v=>Math.min(255,Math.round(parseInt(v,16)*k)).toString(16).padStart(2,'0')).join('');}
